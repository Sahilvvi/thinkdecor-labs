<!doctype html>
<html lang="en">
  <head>
    <!-- Analytics/advertising pixels are NOT loaded here: src/lib/consent.ts injects them only after the visitor accepts cookies. -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static fallbacks: crawlers and link previews read these before React's
         <SEO> runs, so keep them in step with the homepage copy. -->
    <title>Think Decor | AI Interior Design From a Photo</title>
    <link rel="alternate" type="application/rss+xml" title="Think Decor Journal" href="/rss.xml" />
    <meta name="description" content="Upload a photo of any room and Mantha AI redesigns it in the style you choose. Start with 2 free redesigns, then 69p for your first month." />
    <meta name="author" content="Think Decor" />
    <meta name="keywords" content="AI interior design, redesign room from photo, AI room design, room design app, interior design tool online, virtual interior design, AI home decor, room makeover app" />
    <link rel="canonical" href="https://www.thinkdecor.app/" />

    <meta property="og:title" content="Think Decor | AI Interior Design From a Photo" />
    <meta property="og:description" content="Upload a photo of any room and Mantha AI redesigns it in the style you choose. 2 free redesigns to start." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.thinkdecor.app/" />
    <meta property="og:image" content="https://www.thinkdecor.app/og-image.png" />
    <meta property="og:site_name" content="Think Decor" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ThinkDecor" />
    <meta name="twitter:title" content="Think Decor | AI Interior Design From a Photo" />
    <meta name="twitter:description" content="Upload a photo of any room and Mantha AI redesigns it in the style you choose. 2 free redesigns to start." />
    <!-- Must be absolute: Twitter/X ignores relative image paths, so a
         root-relative URL here means no preview image at all. -->
    <meta name="twitter:image" content="https://www.thinkdecor.app/og-image.png" />
    
    <!-- Brand type: Newsreader (display serif), Plus Jakarta Sans (body), Urbanist (labels/buttons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=5">
    <link rel="shortcut icon" href="/favicon.ico?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
